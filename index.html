<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand - Tienda</title>
    <!-- Bootstrap CSS Local -->
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./src/css/styles.css">
    <!-- Inter Font (fallback) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-dark" href="#" id="nav-brand">Brand</a>
            
            <div class="d-flex order-lg-last align-items-center">
                <a href="#" class="text-dark position-relative me-3 me-lg-0 fs-5">
                    <i class="bi bi-cart3"></i>
                </a>
                <!-- Hidden on mobile to perfectly match the design, visible on lg -->
                <button class="navbar-toggler ms-2 border-0 shadow-none p-0 d-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse justify-content-center d-none d-md-flex" id="navbarNav">
                <ul class="navbar-nav gap-2 gap-lg-4">
                    <li class="nav-item">
                        <a class="nav-link active text-dark fw-semibold" href="#" id="nav-home">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#" id="nav-products">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Nosotros</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- SPA: HOME VIEW -->
    <div id="view-home">
        <!-- Hero Section -->
        <section class="container my-4 my-md-4">
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-9">
                    <div class="bg-light rounded-4 px-4 py-4 p-md-5 hero-bg">
                <div class="row align-items-center mx-0">
                    <div class="col-7 col-md-6 d-flex flex-column justify-content-center px-0 pe-2">
                        <h1 class="fw-bold text-dark leading-tight mb-2 fs-3 fs-md-1">Encuentra lo<br>que necesitas</h1>
                        <p class="text-secondary mb-3 fs-6 d-none d-sm-block">Productos de calidad al<br>mejor precio.</p>
                        <p class="text-secondary mb-3 d-block d-sm-none" style="font-size: 0.8rem;">Productos de calidad al<br>mejor precio.</p>
                        <div>
                            <button id="btn-hero-products" class="btn btn-primary px-3 py-2 rounded-3 fw-medium btn-brand" style="font-size: 0.9rem;">Ver productos</button>
                        </div>
                    </div>
                    <div class="col-5 col-md-6 text-end px-0 d-flex justify-content-end">
                        <div class="hero-image-wrapper rounded-4 d-inline-flex align-items-center justify-content-center p-2 p-md-3 w-100 h-100">
                            <img src="./src/assets/headphones.jpg" alt="Audifonos" class="img-fluid hero-image mix-blend-multiply">
                        </div>
                    </div>
                </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Features Section -->
        <section class="container mb-5">
            <div class="bg-white border border-light rounded-4 shadow-sm" id="features-container">
                <!-- Rendered by JS MVC -->
            </div>
        </section>

        <!-- Categories Section -->
        <section class="container mb-5">
            <h3 class="fw-bold fs-6 mb-4 text-dark">Categorías populares</h3>
            <div class="row g-3" id="categories-container">
                <!-- Rendered by JS MVC -->
            </div>
        </section>
    </div>

    <!-- SPA: PRODUCTS VIEW -->
    <div id="view-products" class="d-none">
        <section class="container my-4">
            <h2 class="fw-bold fs-5 mb-3 text-dark">Nuestros productos</h2>
            
            <div class="d-flex gap-2 mb-4">
                <div class="position-relative flex-grow-1">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" id="search-input" class="form-control ps-5 py-2 rounded-3 bg-light border-0" placeholder="Buscar productos...">
                </div>
                <button class="btn btn-light border py-2 px-3 fw-medium rounded-3">Filtrar</button>
            </div>

            <div class="row g-3" id="products-grid">
                <!-- Rendered by JS MVC -->
            </div>

            <div class="d-flex justify-content-center mt-4 mb-5">
                <nav>
                    <ul class="pagination pagination-sm">
                        <li class="page-item active"><a class="page-link btn-brand text-white border-0" href="#">1</a></li>
                        <li class="page-item"><a class="page-link text-dark border-0 bg-light ms-2 rounded-3" href="#">2</a></li>
                        <li class="page-item"><a class="page-link text-dark border-0 bg-light ms-2 rounded-3" href="#">3</a></li>
                    </ul>
                </nav>
            </div>
        </section>
    </div>

    <!-- SPA: DETAIL VIEW -->
    <div id="view-detail" class="d-none">
        <section class="container my-4" id="detail-container">
            <!-- Rendered by JS MVC -->
        </section>
    </div>

    <!-- Bootstrap JS Local -->
    <script src="./bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- App JS Modules -->
    <script type="module" src="./src/app.js"></script>
</body>
</html>
