<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand - Home</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./src/css/styles.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 border-bottom-0">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-dark" href="#">Brand</a>
            
            <div class="d-flex order-lg-last align-items-center">
                <a href="#" class="text-dark position-relative me-3 me-lg-0 fs-5">
                    <i class="bi bi-cart3"></i>
                </a>
                <button class="navbar-toggler ms-2 border-0 shadow-none p-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav gap-2 gap-lg-4">
                    <li class="nav-item">
                        <a class="nav-link active text-dark fw-semibold" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Nosotros</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="container my-4 my-md-4">
        <div class="row bg-light rounded-4 align-items-center px-4 py-5 p-md-5 mx-0 hero-bg">
            <div class="col-12 col-md-6 order-2 order-md-1 pt-4 pt-md-0">
                <h1 class="display-5 fw-bold mb-3 text-dark leading-tight">Encuentra lo<br>que necesitas</h1>
                <p class="text-secondary mb-4 fs-6 w-75">Productos de calidad al<br>mejor precio.</p>
                <a href="#" class="btn btn-primary px-4 py-2 rounded-3 fw-medium btn-brand">Ver productos</a>
            </div>
            <div class="col-12 col-md-6 order-1 order-md-2 text-center text-md-end">
                <div class="hero-image-wrapper rounded-4 d-inline-block px-5 py-4">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" alt="Audifonos" class="img-fluid hero-image mix-blend-multiply">
                </div>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section class="container mb-5" id="features-container">
        <!-- Rendered by JS MVC -->
    </section>

    <!-- Categories Section -->
    <section class="container mb-5">
        <h3 class="fw-bold fs-6 mb-4 text-dark">Categorías populares</h3>
        <div class="row g-3" id="categories-container">
            <!-- Rendered by JS MVC -->
        </div>
    </section>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <!-- App JS Modules -->
    <script type="module" src="./src/js/app.js"></script>
</body>
</html>
